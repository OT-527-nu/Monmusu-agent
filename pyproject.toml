[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monmusu-agent"
version = "0.1.0"
description = "Single-agent investigative text game MVP with AI companion characters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "ruff==0.16.0",
]

[project.scripts]
monmusu-agent = "monmusu_agent.agentic_cli:main"
monmusu-agent-agentic = "monmusu_agent.agentic_cli:main"
monmusu-agent-deepseek-contract = "monmusu_agent.agentic_contract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monmusu_agent = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
